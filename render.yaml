services:
  - type: web
    name: transformation-engine-backend
    env: python
    region: singapore
    buildCommand: "cd backend && pip install -r requirements.txt && alembic upgrade head"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: erp-database
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.0

databases:
  - name: erp-database
    region: singapore
    databaseName: erp_db
    user: erp_user
